# Client-side routing fallback for the estimator SPA. Real files (assets,
# images, fonts) are served directly; unknown sub-paths fall back to the app
# shell so deep links like /estimator/architect-fee work on refresh.
[[redirects]]
  from = "/estimator/*"
  to = "/estimator/index.html"
  status = 200

# Shared renderer is imported as an ES module by the admin
[[headers]]
  for = "/cms/*"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

# The site's scripts and styles carry content hashes in their names, so they can be cached for a long time.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# /team.html is the team page's URL; the short forms land there.
[[redirects]]
  from = "/team"
  to = "/team.html"
  status = 301

[[redirects]]
  from = "/team/"
  to = "/team.html"
  status = 301

# Client brief form: private link only, never indexed, never leaks the token in a Referer header
[[headers]]
  for = "/onboard/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-cache"

# Serve the admin SPA, same as the rewrites in vercel.json
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/admin/index.html"
  status = 200


# Daily mobile + desktop Google PageSpeed Insights checks (05:00 UTC).
[functions."pagespeed-monitor"]
  schedule = "0 5 * * *"
