# The site is static files in public/, assembled at deploy time from three sources:
#  - site/          the home, works, project, team and contact pages (Next.js, static
#                   export), installed into public/ by scripts/build-site.mjs
#  - content.json   /blog, /projects, /updates and /shop, generated by build-cms.mjs
#                   (edited through /admin)
#  - vs-calculator/ the /estimator app (React/Vite)
[build]
  publish = "public"
  command = "node scripts/build-site.mjs && node scripts/build-cms.mjs && node scripts/seo/build-cost-guides.mjs && cd vs-calculator && npm ci && npm run build && rm -rf ../public/estimator && cp -r dist ../public/estimator"

[build.environment]
  NODE_VERSION = "22"

# Serverless functions (e.g. /.netlify/functions/submit-lead, which attaches
# the generated estimate PDF to a Zoho CRM lead — see netlify/functions/).
[functions]
  directory = "netlify/functions"

# Apex → www is handled by Netlify's domain management (primary domain +
# alias redirect). A duplicate redirect here can ping-pong against that and
# cause "too many redirects" loops, so it's intentionally left out.

# /pricing is a canonical short URL for the estimator pricing page.
[[redirects]]
  from = "/pricing"
  to = "/estimator"
  status = 301

# Retired off-topic page (copy of Google's canonicalization docs). 301 to home
# so any links or index entries consolidate instead of 404ing.
[[redirects]]
  from = "/canonical-url"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/canonical-url/*"
  to = "/"
  status = 301
  force = true


# Legacy malformed paths reported by Google Search Console (Nov 2026).
# Exact 301s consolidate old nested Framer links into their current page URLs.
[[redirects]]
  from = "/contact/contact"
  to = "/contact/"
  status = 301
  force = true

[[redirects]]
  from = "/contact/estimator"
  to = "/estimator/"
  status = 301
  force = true

[[redirects]]
  from = "/contact/project-showcase"
  to = "/project-showcase/"
  status = 301
  force = true

[[redirects]]
  from = "/project-showcase/contact"
  to = "/contact/"
  status = 301
  force = true

[[redirects]]
  from = "/project-showcase/artwist-salon/koan"
  to = "/project-showcase/koan/"
  status = 301
  force = true

[[redirects]]
  from = "/project-showcase/artwist-salon/pipe-nova"
  to = "/project-showcase/pipe-nova/"
  status = 301
  force = true

[[redirects]]
  from = "/project-showcase/flutecase/koan"
  to = "/project-showcase/koan/"
  status = 301
  force = true

[[redirects]]
  from = "/project-showcase/flutecase/pipe-nova"
  to = "/project-showcase/pipe-nova/"
  status = 301
  force = true

[[redirects]]
  from = "/project-showcase/project-showcase/artwist-salon"
  to = "/project-showcase/artwist-salon/"
