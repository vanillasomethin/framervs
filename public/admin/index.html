<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Site Admin · Vanilla &amp; Somethin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css?v=4">
</head>
<body>
  <!-- Login -->
  <div id="login-view" class="login-screen" hidden>
    <form id="login-form" class="login-card">
      <div class="brand">VANILLA <span>&amp;</span> SOMETHIN</div>
      <h1>Site admin</h1>
      <p class="muted">Add journal stories, projects and studio updates.</p>
      <div id="setup-notice" class="notice warn" hidden></div>
      <label class="field">
        <span>Password</span>
        <input id="login-password" type="password" autocomplete="current-password" required autofocus>
      </label>
      <button class="btn primary block" type="submit" id="login-button">Log in</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </div>

  <!-- App -->
  <div id="app-view" class="app" hidden>
    <aside class="sidebar">
      <div class="brand">VANILLA <span>&amp;</span> SOMETHIN</div>
      <nav id="main-nav">
        <a href="#/" data-route="dashboard"><span class="icon">◧</span>Dashboard</a>
        <a href="#/blog" data-route="blog"><span class="icon">✎</span>Journal</a>
        <a href="#/projects" data-route="projects"><span class="icon">▦</span>Projects</a>
        <a href="#/updates" data-route="updates"><span class="icon">◉</span>Updates</a>
        <a href="#/settings" data-route="settings"><span class="icon">⚙</span>Settings</a>
      </nav>
      <div class="sidebar-foot">
        <a href="/" target="_blank" rel="noopener">View website ↗</a>
        <button type="button" class="link" id="logout-button">Log out</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div id="save-state" class="save-state"></div>
        <div class="topbar-actions">
          <button type="button" class="btn ghost" id="discard-button" hidden>Discard changes</button>
          <button type="button" class="btn primary" id="publish-button" disabled>Publish</button>
        </div>
      </header>
      <div id="view" class="view"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="loading" class="loading-screen"><div class="spinner"></div></div>

  <script type="module" src="/admin/admin.js?v=4"></script>
</body>
</html>
