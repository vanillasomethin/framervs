<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#101010"/><text x="64" y="78" fill="#fff" font-family="Arial" font-size="28" letter-spacing="4">ARCHITECT FEE MODELS</text><text x="64" y="132" fill="#fff" font-family="Arial" font-size="54" font-weight="700">4 ways to price a service</text><g font-family="Arial"><g transform="translate(64 190)"><rect width="520" height="150" rx="18" fill="#242424"/><text x="28" y="48" fill="#f21d2f" font-size="22" font-weight="700">01 / PERCENTAGE</text><text x="28" y="94" fill="#fff" font-size="30" font-weight="700">3%–10%+</text><text x="28" y="126" fill="#bcbcbc" font-size="17">Define cost base, exclusions and fee cap</text></g><g transform="translate(616 190)"><rect width="520" height="150" rx="18" fill="#242424"/><text x="28" y="48" fill="#f21d2f" font-size="22" font-weight="700">02 / PER SQ FT</text><text x="28" y="94" fill="#fff" font-size="30" font-weight="700">₹15–₹150+</text><text x="28" y="126" fill="#bcbcbc" font-size="17">Rate changes with scope and deliverables</text></g><g transform="translate(64 370)"><rect width="520" height="150" rx="18" fill="#242424"/><text x="28" y="48" fill="#f21d2f" font-size="22" font-weight="700">03 / FIXED FEE</text><text x="28" y="94" fill="#fff" font-size="30" font-weight="700">₹40k–₹7L+</text><text x="28" y="126" fill="#bcbcbc" font-size="17">Set revisions, stages and extra-service rates</text></g><g transform="translate(616 370)"><rect width="520" height="150" rx="18" fill="#242424"/><text x="28" y="48" fill="#f21d2f" font-size="22" font-weight="700">04 / DESIGN + BUILD</text><text x="28" y="94" fill="#fff" font-size="30" font-weight="700">Separate contract</text><text x="28" y="126" fill="#bcbcbc" font-size="17">Construction price is not an architect fee</text></g></g><text x="64" y="580" fill="#999" font-family="Arial" font-size="16">Indicative planning bands only · not official tariffs or a market survey</text></svg>