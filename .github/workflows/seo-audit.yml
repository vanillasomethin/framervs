name: SEO integrity

on:
  pull_request:
    paths:
      - "public/**"
      - "site/**"
      - "scripts/build-site.mjs"
      - "scripts/audit-seo.mjs"
      - "scripts/seo/**"
      - "lighthouserc.json"
      - "scripts/build-cms.mjs"
      - "public/cms/**"
      - "public/admin/**"
      - "netlify/functions/cms.js"
      - "vs-calculator/**"
      - ".github/workflows/seo-audit.yml"
  push:
    branches: [main]
    paths:
      - "public/**"
      - "site/**"
      - "scripts/build-site.mjs"
      - "scripts/audit-seo.mjs"
      - "scripts/build-cms.mjs"
      - "scripts/seo/**"
      - "netlify/functions/cms.js"
      - "vs-calculator/**"

jobs:
  static-seo-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check CMS JavaScript syntax
        run: |
          node --check public/cms/render.mjs
          node --check scripts/build-cms.mjs
          node --check netlify/functions/cms.js
          node --input-type=module --check < public/admin/admin.js
      - name: Build estimator app
        run: cd vs-calculator && npm ci && npm run build
      - name: Build site pages (home, showcase, team, contact)
        run: node scripts/build-site.mjs
      - name: Generate CMS pages and sitemap
        run: node scripts/build-cms.mjs
      - name: Generate visual cost guide cluster
        run: node scripts/seo/build-cost-guides.mjs
      - name: Audit static SEO metadata and sitemaps
        run: node scripts/audit-seo.mjs
      - name: Install headless Chromium
        # Pin the runner to Ubuntu 24.04: Playwright 1.55 does not recognise
        # ubuntu-26.04 yet when installing system dependencies with --with-deps.
        run: |
          npm i --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Audit rendered pages (what Google indexes after JavaScript)
        run: node scripts/seo/audit-rendered.mjs
      - name: Lighthouse CI (SEO must stay >= 90; performance and accessibility warn)
        run: npx --yes @lhci/cli@0.14.0 autorun
